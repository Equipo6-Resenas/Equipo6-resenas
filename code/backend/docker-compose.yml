services:
  postgres-resenas:
    image: postgres:16-alpine
    container_name: postgres-resenas
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-resenas}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT_PUBLISHED:-5440}:5432"
    volumes:
      - resenas-postgres-data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./src/database/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-resenas}"
        ]
      interval: 5s
      timeout: 5s
      
      retries: 20
    networks:
      plataforma-eventos-net:
        aliases:
          - postgres-resenas

  ms-resenas:
    build: .
    container_name: ms-resenas
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: postgres-resenas
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-resenas}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      CATALOGO_SERVICE_URL: ${CATALOGO_SERVICE_DOCKER_URL:-http://ticketu-api-gateway:8080/api/catalogo}
      API_GATEWAY_URL: ${API_GATEWAY_DOCKER_URL:-http://ticketu-api-gateway:8080}
      CHECKIN_SERVICE_URL: ${CHECKIN_SERVICE_DOCKER_URL:-http://checkin-service:3005/api/checkin}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_DOCKER_URL:-http://auth-service:10000}
      AUTH_INTERNAL_API_KEY: ${AUTH_INTERNAL_API_KEY:-}
      AUTH_TIMEOUT_MS: ${AUTH_TIMEOUT_MS:-1000}
      CATALOGO_TIMEOUT_MS: ${CATALOGO_TIMEOUT_MS:-2000}
      CHECKIN_TIMEOUT_MS: ${CHECKIN_TIMEOUT_MS:-2000}
      SERVICE_TO_SERVICE_TOKEN: ${SERVICE_TO_SERVICE_TOKEN:-}
      BROKER_URL: ${BROKER_DOCKER_URL:-amqp://ticketu:ticketu_dev@ticketu-rabbitmq:5672/ticketu}
      EVENT_EXCHANGE: ticketu.events
    ports:
      - "5000:3000"
    depends_on:
      postgres-resenas:
        condition: service_healthy
    networks:
      plataforma-eventos-net:
        aliases:
          - ms-resenas
          - resenas-service

volumes:
  resenas-postgres-data:

networks:
  plataforma-eventos-net:
    external: true